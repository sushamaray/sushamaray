name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily update
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%236a11cb&color_dots=%23ebedf0,%23d4b8f0,%23b087e0,%238c56d0,%236a11cb
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%236a11cb

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
